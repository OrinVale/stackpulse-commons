name: Validate StackPulse

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m py_compile stackpulse.py source_discovery.py
      - name: Verify compact-state comparison
        run: python -m unittest discover -s tests -v
      - name: Render deterministic fixture
        run: python stackpulse.py demo --fixture fixtures/demo.json
      - name: Verify fixture outputs
        run: test -s output/demo.json && test -s output/demo.html
